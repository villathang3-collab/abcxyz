[env:xingzhi-cube-s3]
; 1. QUAN TRỌNG: Dùng platform và board chuẩn để có file sdkconfig.h
platform = espressif32
board = esp32-s3-devkitc-1
board_dir = boards
framework = arduino
build_src_filter =${env.build_src_filter} +<../boards/xingzhi-cube-s3>
; 2. Cấu hình bộ nhớ (Flash 16MB, PSRAM OPI)
board_upload.flash_size = 16MB
board_build.partitions = custom_16Mbv2.csv
; Nếu không có file custom_16Mb.csv thì đổi thành default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

; 3. CÁC CỜ BUILD (QUAN TRỌNG NHẤT)
build_flags =
    ; Thêm thư mục boards vào đường dẫn include
    -Iboards
    -Iboards/xingzhi-cube-s3
    ${env.build_flags}



    ; Các cờ hệ thống khác
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D ESP32S3
    -D DISABLE_AUDIO
    -D DEVICE_NAME=\"Xingzhi-Cube\"

; 4. Thư viện
lib_deps =
    ${env.lib_deps}
    https://github.com/bmorcelli/ESP32_Button
lib_ignore =
    audio-driver


