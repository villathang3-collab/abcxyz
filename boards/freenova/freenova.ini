[env:freenova]
extends = env
board = esp32-s3-devkitc-1
board_build.variant = freenova
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/freenova>

build_flags =
    ${env.build_flags}
    -Iboards/freenova
    -D BRUCE_FREENOVA=1
    -DBOARD_HAS_PSRAM=1
    -DALLOW_ALL_GPIO_FOR_IR_RF=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    
    ; TFT Screen (Corrected based on documentation)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DCGRAM_OFFSET=1
    -DTFT_MOSI=11
    -DTFT_MISO=13
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45

    ; Touch
    -DHAS_TOUCH=1
    -DTOUCH_SDA=16
    -DTOUCH_SCL=15
    -DTOUCH_RST=18
    -DTOUCH_INT=17

    ; SD Card (4-bit MMC)
    -DHAS_SD_MMC=1
    -DSD_MMC_CLK=38
    -DSD_MMC_CMD=40
    -DSD_MMC_D0=39
    -DSD_MMC_D1=41
    -DSD_MMC_D2=48
    -DSD_MMC_D3=47

    ; RGB LED
    -DHAS_RGB_LED=1
    -DRGB_LED_PIN=42

lib_deps =
    ${env.lib_deps}
