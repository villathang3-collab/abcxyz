[env:esp32-c5-tft]
board = esp32-c5-devkitc-1
board_build.partitions = custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/ESP32-C5-tft>

build_flags =
	${env.build_flags}
	-Iboards/ESP32-C5-tft
	-DDEVICE_NAME='"ESP32-C5"'
	-DESP32C5_DEVKITC_1_TFT=1
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=1

	; text sizes & UI
	-DFP=1
	-DFM=2
	-DFG=3
	-DBTN_ALIAS='"OK"'

    ; Cờ đảo màu màn hình. Nếu màu bị ngược (đen thành trắng bợt), hãy đổi thành 0
    -DTFT_INVERSION_ON=1